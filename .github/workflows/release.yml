name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained
        run: dotnet publish "-p:PublishProfile=SelfContained"

      - name: Publish framework-dependent
        run: dotnet publish "-p:PublishProfile=Framework"

      - name: Rename artifacts
        run: |
          mv publish/self-contained/Capturius.exe publish/Capturius-SelfContained.exe
          mv publish/framework-dependent/Capturius.exe publish/Capturius.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Capturius-SelfContained.exe
            publish/Capturius.exe
          generate_release_notes: true
